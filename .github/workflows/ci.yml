# CI — public repo (free-plan runners, unlimited for public repos).
#
# push/PR: full gate minus the heavy stress — unit (+ stress generator CA),
# e2e (test-electron on xvfb), stress SMOKE 100x100, vsix content check.
# tag v*: everything above + stress FULL 1000x1000 + vsce pack (artifact).
#
# Toolchain: pnpm/action-setup@v4 reads `packageManager` (pnpm@10.33.2);
# setup-node@v4 uses .nvmrc (22.14.0) + the pnpm store cache.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (unit + e2e + stress smoke + vsix)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Typecheck
        run: pnpm run typecheck:all
      - name: Unit + stress generator CA
        run: pnpm test
      - name: E2E (test-electron, xvfb preinstalled on ubuntu-latest)
        run: xvfb-run -a pnpm test:integration
      - name: Stress smoke (100 x 100 — the locked full-scale budget bounds it)
        run: STRESS_SCENARIOS=100 STRESS_STEPS=100 pnpm test:stress
      - name: Vsix content check (no test/features/qa/SPEC in the vsix)
        # A real assertion: `vsce ls` alone can never fail (it is a list).
        # A `.vscodeignore` regression (e.g. a removed `test/` line) must
        # fail the build, not ride into the next pack (probe 2026-11-10:
        # 32 `test/` files listed, exit 0).
        run: |
          if pnpm exec vsce ls | grep -qE '^(test|features|qa)/|^SPEC\.md$'; then
            echo "::error::the vsix would ship test/features/qa/SPEC content — .vscodeignore regression"
            exit 1
          fi

  release:
    name: release (stress full + vsix pack)
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Stress full (1000 x 1000 — the wall-time budget gate)
        run: pnpm test:stress
      - name: Pack the vsix (pack = validation in vsce 4.x)
        run: pnpm exec vsce pack
      - name: Upload the vsix
        uses: actions/upload-artifact@v4
        with:
          name: gherkin-behat-linker-${{ github.ref_name }}
          path: "*.vsix"
